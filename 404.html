<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página não encontrada · Luiz Rioga</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B0C0B" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0B0C0B;
      color: #F3F4F0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border-radius: 18px;
      background: #141614;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: #C6F135;
      margin-bottom: 12px;
    }
    h1 { font-size: 28px; line-height: 1.15; margin-bottom: 12px; }
    p { font-size: 14px; line-height: 1.6; color: #9EA59B; margin-bottom: 24px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #C6F135;
      color: #101210;
      text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    a:hover { background: #d5ff4d; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERRO 404 // ROTA INDISPONÍVEL</div>
    <h1>Página não encontrada.</h1>
    <p>O endereço acessado não existe ou foi movido. Retorne à página principal do portfólio de Luiz Rioga.</p>
    <a href="/">Voltar para luizrioga.com ↗</a>
  </main>
</body>
</html>
